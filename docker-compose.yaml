name: msa

services:
  postgres:
    image: postgres:16
    container_name: msa-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: postgres
    volumes:
      - ../docker/msa/postgres/:/var/lib/postgresql/data
    ports:
      - 54322:5432
    restart: unless-stopped
    networks:
      - msa

networks:
  msa:
    name: msa
